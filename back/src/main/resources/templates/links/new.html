<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>단축 링크 만들기</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="min-h-screen flex flex-col items-center justify-center gap-4">
<h1 class="text-2xl font-bold">단축 링크 만들기</h1>
<p class="text-red-600" th:if="${error}" th:text="${error}"></p>
<form class="flex flex-col gap-2 w-80" method="post" th:action="@{/links}">
    <label class="flex flex-col text-sm">원본 URL
        <input class="border rounded px-3 py-2" type="text" name="originalUrl" th:value="${originalUrl}" placeholder="https://op.gg/summoners/kr/Faker-KR1" required/>
    </label>
    <label class="flex flex-col text-sm">도메인 축약어 (비워두면 자동)
        <input class="border rounded px-3 py-2" type="text" name="domainPrefix" th:value="${domainPrefix}" placeholder="op"/>
    </label>
    <label class="flex flex-col text-sm">별칭
        <input class="border rounded px-3 py-2" type="text" name="alias" th:value="${alias}" placeholder="Faker-KR1" required/>
    </label>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button class="rounded bg-blue-600 px-4 py-2 text-white" type="submit">만들기</button>
</form>
</body>
</html>
