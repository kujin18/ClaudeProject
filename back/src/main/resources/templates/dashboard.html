<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>대시보드</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="min-h-screen flex flex-col items-center gap-4 p-8">
<h1 class="text-2xl font-bold">내 단축 링크</h1>
<a class="rounded bg-blue-600 px-4 py-2 text-white" th:href="@{/links/new}">새 링크 만들기</a>
<p th:if="${links.isEmpty()}">아직 만든 단축 링크가 없습니다.</p>
<table class="w-full max-w-4xl border-collapse" th:if="${!links.isEmpty()}">
    <thead>
    <tr class="text-left border-b">
        <th class="p-2">원본 URL</th>
        <th class="p-2">단축 링크</th>
        <th class="p-2">생성일</th>
        <th class="p-2">클릭 수</th>
        <th class="p-2">공개 상태</th>
        <th class="p-2"></th>
    </tr>
    </thead>
    <tbody>
    <tr class="border-b" th:each="link : ${links}">
        <td class="p-2 break-all" th:text="${link.originalUrl}"></td>
        <td class="p-2 font-mono" th:text="${link.shortLinkPath}"></td>
        <td class="p-2" th:text="${link.createdDate}"></td>
        <td class="p-2" th:text="${link.clickCount}"></td>
        <td class="p-2" th:text="${link.visibility.name() == 'PUBLIC'} ? '공개' : '비공개'"></td>
        <td class="p-2 flex gap-2 items-center">
            <a th:href="@{'/links/' + ${link.id} + '/qr-code'}" target="_blank">QR 보기</a>
            <a th:href="@{'/links/' + ${link.id} + '/qr-code'}" download="qr-code.png">다운로드</a>
            <form method="post" th:action="@{'/links/' + ${link.id} + '/toggle-visibility'}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="rounded bg-slate-600 px-3 py-1 text-white text-sm" type="submit">
                    <span th:text="${link.visibility.name() == 'PUBLIC'} ? '비공개로 전환' : '공개로 전환'"></span>
                </button>
            </form>
            <form method="post" th:action="@{'/links/' + ${link.id} + '/delete'}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="rounded bg-red-600 px-3 py-1 text-white text-sm" type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
