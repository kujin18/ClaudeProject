<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>계정 핸들 설정</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="min-h-screen flex flex-col items-center justify-center gap-4">
<h1 class="text-2xl font-bold">계정 핸들 설정</h1>
<p class="text-red-600" th:if="${error}" th:text="${error}"></p>
<form class="flex gap-2" method="post" th:action="@{/setup-handle}">
    <input class="border rounded px-3 py-2" type="text" name="handle" th:value="${handle}" placeholder="예: kujin" required/>
    <button class="rounded bg-blue-600 px-4 py-2 text-white" type="submit">설정하기</button>
</form>
</body>
</html>
