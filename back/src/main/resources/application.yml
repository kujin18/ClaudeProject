spring:
  application:
    name: back
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/back}
    username: ${DB_USERNAME:back}
    password: ${DB_PASSWORD:back}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
